# Sync third-party skills from upstream (dependencies.json).
# Commits directly to the default branch (no PR): GITHUB_TOKEN cannot open
# pull requests when the org/repo forbids Actions from creating them.
name: Sync skills

on:
  schedule:
    # Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync from upstream
        env:
          # Higher rate limit for GitHub tree/raw APIs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync

      # sync also refreshes README; keep explicit for clarity / if markers drift
      - name: Refresh README skills table
        run: npm run readme

      - name: Commit to default branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A plugins dependencies.json README.md
          if git diff --cached --quiet; then
            echo 'No skill/README changes'
            exit 0
          fi
          git commit -m 'chore: sync third-party skills'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
